[project]
name = "carlabev-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "CarlaBEV",
    "dotenv>=0.9.9",
    "moviepy>=2.2.1",
    "numpy>=2.3.1",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.1",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "scipy>=1.16.0",
    "setuptools==80",
    "stable-baselines3>=2.6.0",
    "tensorboard>=2.20.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tyro>=0.9.26",
    "jupyter",
    "seaborn",
    "optuna>=4.7.0",
    "plotly>=6.5.2",
    "scikit-learn>=1.8.0",
]

[project.scripts]
carlabev-lab = "src.carlabev_lab.cli.main:main"
drl = "src.carlabev_lab.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.9.9",
    "pre-commit>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated tests",
    "integration: multi-module local integration",
    "slow: heavier training or evaluation smoke tests",
    "envdep: requires the CarlaBEV package/runtime contract",
]

